<!DOCTYPE html>
<html>
<head>
<title>LGM Customer Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{font-family:Arial;background:#f4f4f4;margin:0}.header{background:#2980b9;color:white;padding:15px;text-align:center}.container{padding:20px;max-width:800px;margin:auto}.card{background:white;padding:15px;margin-bottom:15px;border-radius:8px}</style>
</head>
<body>
<div class="header"><h2>🛒 LGM Customer Dashboard</h2></div>
<div class="container">
<div class="card">
<h3>My Profile</h3>
<p>Name: <input type="text" placeholder="Your Name"></p>
<p>Delivery Address: <input type="text" placeholder="Your Address in Lokoja"></p>
<p>Phone: <input type="tel" placeholder="080..."></p>
</div>
<div class="card">
<h3>My Orders</h3>
<p>No orders yet. <a href="index.html">Go Shop</a></p>
</div>
<div class="card">
<h3>Pay with Flutterwave</h3>
<p>When you checkout, payment goes to LGM. We auto-split 90% to vendor.</p>
</div>
</div>
</body>
</html>

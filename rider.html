<!DOCTYPE html>
<html>
<head>
<title>LGM Rider Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>body{font-family:Arial;background:#f4f4f4;margin:0}.header{background:#8e44ad;color:white;padding:15px;text-align:center}.container{padding:20px;max-width:800px;margin:auto}.card{background:white;padding:15px;margin-bottom:15px;border-radius:8px}.order{border-left:4px solid #27ae60;padding-left:10px;margin:10px 0}</style>
</head>
<body>
<div class="header"><h2>🚚 LGM Rider Dashboard</h2></div>
<div class="container">
<div class="card">
<h3>Rider Profile</h3>
<input type="text" placeholder="Rider Name">
<input type="text" placeholder="Bike/Vehicle Number">
<input type="tel" placeholder="Phone Number">
</div>
<div class="card">
<h3>Available Deliveries in Lokoja</h3>
<div class="order">
<b>Order #LGM001</b><br>
50kg Rice to Ganaja<br>
Earning: ₦500<br>
<button>Accept Delivery</button>
</div>
</div>
<div class="card">
<h3>My Earnings</h3>
<p>Total this week: ₦3,500</p>
</div>
</div>
</body>
</html>

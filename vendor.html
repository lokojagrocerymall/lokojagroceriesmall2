<!DOCTYPE html>
<html>
<head>
<title>LGM Vendor Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{font-family:Arial;background:#f4f4f4;margin:0}
.header{background:#27ae60;color:white;padding:15px;text-align:center}
.container{padding:20px;max-width:800px;margin:auto}
.card{background:white;padding:15px;margin-bottom:15px;border-radius:8px;box-shadow:0 2px 5px #ccc}
input,textarea{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:5px}
button{background:#e74c3c;color:white;border:none;padding:12px 20px;border-radius:5px;cursor:pointer;font-weight:bold}
label{font-weight:bold}
</style>
</head>
<body>
<div class="header"><h2>🏪 LGM Vendor Dashboard</h2></div>
<div class="container">

<div class="card">
<h3>1. Shop Information</h3>
<input type="text" id="shopName" placeholder="Shop Name e.g Mama Nkechi Stores">
<input type="text" id="shopAddress" placeholder="Shop Address in Lokoja">
<input type="tel" id="shopPhone" placeholder="Shop Phone Number">
</div>

<div class="card">
<h3>2. Bank + KYC for Flutterwave 90% Payout</h3>
<input type="text" id="accountName" placeholder="Bank Account Name">
<input type="text" id="accountNumber" placeholder="Bank Account Number">
<input type="text" id="bankName" placeholder="Bank Name e.g GTBank">
<input type="text" id="nin" placeholder="NIN Number - Required by Flutterwave">
<button onclick="saveVendor()">Save Shop Details</button>
</div>

<div class="card">
<h3>3. Upload Product</h3>
<input type="text" id="pName" placeholder="Product Name e.g 50kg Rice">
<input type="number" id="pPrice" placeholder="Price e.g 65000">
<input type="file" id="pImage">
<textarea id="pDesc" placeholder="Product Description"></textarea>
<button onclick="addProduct()">Add Product to LGM</button>
</div>

<div class="card">
<h3>4. My Products</h3>
<div id="productList">No products yet</div>
</div>

</div>
<script>
function saveVendor(){alert("Shop details saved! Flutterwave will verify your NIN & Bank")}
function addProduct(){alert("Product added! It will now show on main LGM store")}
</script>
</body>
</html>
